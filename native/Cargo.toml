[package]
name = "rpp"
version = "0.7.1"
edition = "2024"
description = "RPP — Ran Plan Plan, a lightweight native 2D floor-plan editor"
license = "0BSD"
repository = "https://github.com/Bagyette/rpp-app"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
postcard = { version = "1.1.3", features = ["use-std"] }
miniz_oxide = "0.8.9"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
base64 = "0.22"
resvg = { version = "0.47", default-features = false, features = ["raster-images", "system-fonts", "text"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
